<html>

<head>
	<title>KV</title>
	<script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
	<script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@<0.159.0>/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@<0.159.0>/examples/jsm/"
        }
      }
    </script>
</head>

<body>
	<div>
		<h1 id="title">KV</h1>
	</div>
	<div class="container">
		<div id="info_and_controls_wrapper">
			<div class="info_and_controls">
				<label for="location">Location:</label>
				<select id="location">
					<option value="local">Local</option>
					<option value="remote">Remote</option>
				</select>
			</div>

			<div class="info_and_controls">
				<p id="gps"></p>
				<p id="quat"></p>
				<p id="yaw"></p>
			</div>

			<div class="info_and_controls">
				<label for="left">Left:</label>
				<input type="number" id="left" value=90>
				<label for="right">Right:</label>
				<input type="number" id="right" value=90>
				<button id="send_wheels_left_right">send</button>
				<div id="trim_div">
					<label for="magnitude">Magnitude:</label>
					<input type="range" id="magnitude" value=0>
					<label for="trim">Trim:</label>
					<input type="range" id="trim" value=0>
					<button id="send_wheels_mag_trim">send</button>
				</div>
			</div>

			<div class="info_and_controls" style="display: flex;">
				<label for="send_wheels_stop">Stop:&nbsp;</label>
				<button id="send_wheels_stop">Stop</button>
				<div>&nbsp;(or press Enter)</div>
			</div>

			<div class="info_and_controls">
				<h3>Smart Commands</h3>

				<h4>Turn</h4>
				<label for="smart_turn_heading">Heading:</label>
				<input type="number" id="smart_turn_heading" value=0>
				<button id="send_smart_turn">send</button>

				<h4>Straight</h4>
				<label for="smart_straight_duration">Duration:</label>
				<input type="number" id="smart_straight_duration" value=0>
				<label for="smart_straight_velocity">Velocity:</label>
				<input type="number" id="smart_straight_velocity" value=0>
				<button id="send_smart_straight">send</button>

				<h4>Direct</h4>
				<label for="smart_direct_latitude">Latitude:</label>
				<input type="number" id="smart_direct_latitude" value=0>
				<label for="smart_direct_longitude">Longitude:</label>
				<input type="number" id="smart_direct_longitude" value=0>
				<button id="send_smart_direct">send</button>

				<h4>Path</h4>
				<label for="smart_path_path">Path:</label>
				<button id="record_path">record path</button>
				<button id="send_path">send path</button>
			</div>

			<script src="https://threejs.org/build/three.js"></script>
		</div>

		<div id="map-wrapper">
			<div tabindex="700" id="map" class="map"></div>
			<img src="frontend/nyomi_yaw.png" id="nyomi">
		</div>
	</div>

	<link rel="stylesheet" href="frontend/kv.css">
	<link rel="stylesheet" href="frontend/ol.css">
	<link rel="stylesheet" href="frontend/map.css">
	<script src="frontend/jqs.js"></script>
	<script src="frontend/ol.js"></script>
	<script src="frontend/map.js"></script>
	<script src="frontend/kv.js"></script>
	<script src="frontend/wheels.js"></script>
</body>

</html>
